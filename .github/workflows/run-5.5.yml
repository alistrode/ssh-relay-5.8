name: Run SSH Relay 5.5 desktop
on:
  push:
    branches: ['5.5']
    paths: ['src/**', 'desktop/**', 'scripts/run-github-client.cjs', '.github/workflows/run-5.5.yml', 'package*.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-client:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Install application dependencies and the native Electron runtime
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Start the Linux desktop display
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          Xvfb :99 -screen 0 1440x1100x24 > /tmp/ssh-relay-display.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Run the actual client and close it through the tray exit handler
        run: node scripts/run-github-client.cjs
      - name: Archive full source without dependencies, historical packages or private state
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import subprocess,zipfile
          Path('run-output').mkdir(exist_ok=True)
          with zipfile.ZipFile('run-output/SSHRelayPro-5.5-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for entry in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if entry and not entry.startswith(('packages/','run-records/')) and Path(entry).is_file():
                      archive.write(entry,'SSHRelayPro-5.5/'+entry)
      - name: Save source, screenshot and run record to the 5.5 branch
        if: always()
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from pathlib import Path
          import os,json,base64,urllib.request,urllib.error,time
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'
          prefix='run-records/'+os.environ['GITHUB_RUN_ID']+'/'+os.environ['RUNNER_OS'].lower()+'/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for file in Path('run-output').iterdir():
              if file.name not in ['run.json','client.png','SSHRelayPro-5.5-source.zip']:
                  continue
              payload={'message':'docs: save 5.5 '+os.environ['RUNNER_OS']+' application run','branch':'5.5','content':base64.b64encode(file.read_bytes()).decode()}
              url=base+prefix+file.name
              for attempt in range(6):
                  try:
                      try:
                          old=json.load(urllib.request.urlopen(urllib.request.Request(url+'?ref=5.5',headers=headers)))
                          payload['sha']=old['sha']
                      except urllib.error.HTTPError as error:
                          if error.code!=404: raise
                      request=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
                      with urllib.request.urlopen(request) as response:
                          saved=json.load(response)
                      print('Saved '+prefix+file.name)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code!=409 or attempt==5: raise
                      time.sleep(attempt+1)
