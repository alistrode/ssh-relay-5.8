name: Native VMs for direct MCP operation
on:
  workflow_dispatch:
    inputs:
      debug_host:
        description: Authorized legacy Cloudflare endpoint for read-only connection diagnosis
        type: string
        default: ''
permissions:
  contents: read
jobs:
  host:
    if: ${{ inputs.debug_host == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Start the normal application Agent and seal its pairing code
        run: node scripts/operator-host.cjs offer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-authorization-${{ matrix.os }}
          path: operator-exchange/offer.json
          retention-days: 1
      - name: Keep the normal Agent available for direct MCP use
        run: node scripts/operator-host.cjs hold 10800

  legacy-connection:
    if: ${{ inputs.debug_host != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read-only legacy endpoint handshake
        env:
          DEBUG_HOST: ${{ inputs.debug_host }}
        run: |
          [[ "$DEBUG_HOST" =~ ^[a-z0-9-]+\.trycloudflare\.com$ ]] || exit 2
          curl -sS --max-time 20 -o response.txt -w 'HTTP=%{http_code}\n' "https://$DEBUG_HOST"
          head -c 150 response.txt
          curl -fL --speed-limit 819200 --speed-time 15 -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64
          echo '053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0  cloudflared' | sha256sum -c -
          chmod 700 cloudflared
          ./cloudflared access tcp --hostname "$DEBUG_HOST" --url 127.0.0.1:22022 --logfile cloudflared.log &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p 22022 127.0.0.1 > host-key.txt; then
              ssh-keygen -lf host-key.txt
              exit 0
            fi
          done
          tail -n 15 cloudflared.log
          exit 1
