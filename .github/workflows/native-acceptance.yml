name: SSH Relay 5.1 native service and desktop acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-service:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch pinned Windows runtime and service host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          curl.exe -fL --speed-limit 819200 --speed-time 15 --retry 2 -o work/runtime/electron-v44.8.0-win32-x64.zip https://github.com/electron/electron/releases/download/v44.8.0/electron-v44.8.0-win32-x64.zip
          if ($LASTEXITCODE) { throw 'Runtime download failed' }
          curl.exe -fL --retry 2 -o work/runtime/WinSW.NET4.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe
          if ($LASTEXITCODE) { throw 'Service host download failed' }
          curl.exe -fL --retry 2 -o work/runtime/WinSW-LICENSE https://raw.githubusercontent.com/winsw/winsw/v2.12.0/LICENSE.txt
      - name: Build the unified Windows package
        run: python scripts/package-unified.py --platform win32 --cache work/runtime --out work/packaged
      - name: Start actual SYSTEM services and the packaged desktop
        run: node scripts/verify-windows-service.cjs work/packaged/SSHRelayPro-5.1-win32-x64 work/native-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-windows-5.1
          path: |
            work/native-results
            work/packaged/*.zip
            work/packaged/*.sha256
          compression-level: 0
          retention-days: 7
