name: SSH Relay native acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Install pinned production dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Require native process proof and exercise independent task/session runners
        env:
          SSH_RELAY_NATIVE_ACCEPTANCE: '1'
        run: node --test tests/pro/native-acceptance.cjs tests/pro/file-service.cjs tests/pro/file-transfers.cjs tests/pro/shared-manager-budget.cjs
