name: SSH Relay all AI operations
on:
  push:
    branches: [fix/ssh-pro-startup-20261019]
    paths:
      - '.github/workflows/all-ai-acceptance.yml'
      - 'tests/pro/ai-all-tools.mjs'
      - 'tests/pro/prepare-ai-databases.py'
      - 'tests/pro/full-regression.cjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-all-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  all-ai:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Direct native MCP commands, files, sessions and AI operations first
        continue-on-error: true
        run: node tests/pro/ai-all-tools.mjs --core
      - name: Prepare isolated real PostgreSQL, MySQL and MongoDB
        continue-on-error: true
        run: python tests/pro/prepare-ai-databases.py
      - name: All AI tools and actions plus continuous one-hour AI operation
        run: node tests/pro/ai-all-tools.mjs 3600
      - name: Existing automated regression supplements direct usage
        if: always()
        run: node tests/pro/full-regression.cjs
      - name: Upload sanitized coverage and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-ai-${{ matrix.os }}
          path: ai-results/*.json
          if-no-files-found: warn
