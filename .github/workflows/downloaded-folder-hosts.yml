name: Run repository-downloaded complete folders for direct MCP operation
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, linux, windows]
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"os":"windows-2022","platform":"windows","extension":"zip"}]' || inputs.platform == 'linux' && '[{"os":"ubuntu-24.04","platform":"linux","extension":"tar.gz"}]' || '[{"os":"ubuntu-24.04","platform":"linux","extension":"tar.gz"},{"os":"windows-2022","platform":"windows","extension":"zip"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 130
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the published folders, not a source checkout build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ssh-relay-complete-20261022 --repo $env:GITHUB_REPOSITORY --dir downloaded --pattern 'SSHRelay-*-${{ matrix.platform }}-x64.${{ matrix.extension }}' --pattern SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/unpack-published-folders.py downloaded extracted ${{ matrix.platform }}
      - name: Start the downloaded far folder with its own Node runtime
        run: |
          $node = Join-Path $env:FAR_FOLDER ('runtime/' + $(if ($IsWindows) {'node.exe'} else {'node'}))
          & $node scripts/folder-operator-host.cjs $env:FAR_FOLDER offer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-folder-authorization-${{ matrix.platform }}
          path: operator-exchange/offer.json
          retention-days: 1
      - name: Keep the normal downloaded application available for AI operation
        run: |
          $node = Join-Path $env:FAR_FOLDER ('runtime/' + $(if ($IsWindows) {'node.exe'} else {'node'}))
          & $node scripts/folder-operator-host.cjs $env:FAR_FOLDER hold
