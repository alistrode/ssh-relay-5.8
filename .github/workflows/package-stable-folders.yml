name: Package the verified application as complete role folders
on:
  push:
    branches: [fix/ssh-pro-startup-20261019]
    paths: ['.github/workflows/package-stable-folders.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Prepare native Linux SQL clients for inclusion
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16 mysql-client
      - name: Collect complete runtime and client files
        run: python scripts/collect-portable-tools.py runtime-inputs ${{ matrix.platform }}
      - name: Package near and far folders without changing business source
        run: python scripts/package-stable-folders.py runtime-inputs packaged ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-folders-${{ matrix.platform }}
          path: |
            packaged/*.zip
            packaged/*.tar.gz
          compression-level: 0
          retention-days: 7
