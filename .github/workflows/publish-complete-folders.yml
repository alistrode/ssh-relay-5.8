name: Package and publish the current 5.3 Windows folder
on:
  workflow_dispatch:
    inputs:
      linux_only:
        description: Publish Linux x64 alongside the existing responsive Windows release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  package:
    if: ${{ !inputs.linux_only }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Prepare production dependencies
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch pinned runtime and service host
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force work/runtime | Out-Null
          curl.exe -fL --speed-limit 819200 --speed-time 15 -o work/runtime/electron-v44.8.0-win32-x64.zip https://github.com/electron/electron/releases/download/v44.8.0/electron-v44.8.0-win32-x64.zip
          if ($LASTEXITCODE) {
            gh release download v44.8.0 --repo electron/electron --pattern electron-v44.8.0-win32-x64.zip --dir work/runtime --clobber
            if ($LASTEXITCODE) { throw 'Runtime download failed on both sources' }
          }
          curl.exe -fL --speed-limit 819200 --speed-time 15 -o work/runtime/WinSW.NET4.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe
          if ($LASTEXITCODE) {
            gh release download v2.12.0 --repo winsw/winsw --pattern WinSW.NET4.exe --dir work/runtime --clobber
            if ($LASTEXITCODE) { throw 'Service host download failed on both sources' }
          }
          curl.exe -fL -o work/runtime/WinSW-LICENSE https://raw.githubusercontent.com/winsw/winsw/v2.12.0/LICENSE.txt
          if ($LASTEXITCODE) { throw 'Service host license download failed' }
      - name: Copy-only packaging with pinned input checksums
        run: python scripts/package-unified.py --platform win32 --cache work/runtime --out work/packaged
      - name: Publish only the ready-to-run folder ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > work/notes.md <<'TEXT'
          5.3 分支运行包：新生成的配对码有效期为 24 小时，仍只能使用一次；保留此前窗口响应修复。

          保留首次授权安装 SYSTEM 后台服务及后续管理员功能；窗口登录启动设置不再关闭后台服务的自动启动。保留双向五连接、逐台断开及第六台指定替换。

          完整解压后运行 Start.cmd；Restart.cmd 可重新打开窗口。无需安装 Node/npm。仅提供单文件夹运行包，不上传开发缓存。

          本流程仅打包与发布，不运行测试或启动服务验收，不冒称用户实机验证。
          TEXT
          tag="ssh-relay-5.3-responsive-${GITHUB_RUN_ID}"
          gh release create "$tag" work/packaged/SSHRelayPro-5.3-win32-x64.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SSH Relay Pro 5.3 · 配对码有效期 24 小时' --notes-file work/notes.md

  linux:
    if: ${{ inputs.linux_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5f53bec087dc8cec15217c2958a539b4bf16898f
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Prepare production dependencies
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Fetch the pinned Linux runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/runtime
          if ! curl -fL --speed-limit 819200 --speed-time 15 -o work/runtime/electron-v44.8.0-linux-x64.zip https://github.com/electron/electron/releases/download/v44.8.0/electron-v44.8.0-linux-x64.zip; then
            gh release download v44.8.0 --repo electron/electron --pattern electron-v44.8.0-linux-x64.zip --dir work/runtime --clobber
          fi
      - name: Copy-only packaging using the same runtime source commit
        run: python scripts/package-unified.py --platform linux --cache work/runtime --out work/packaged
      - name: Publish only the ready-to-run Linux folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ssh-relay-5.1-responsive-40073599010 work/packaged/SSHRelayPro-5.1-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY"
