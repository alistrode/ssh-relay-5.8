name: SSH Relay unattended hour
on:
  workflow_dispatch:
  push:
    branches: [fix/ssh-pro-startup-20261019]
    paths:
      - '.github/workflows/hour-stability.yml'
      - 'tests/pro/unattended-hour.cjs'
permissions:
  contents: read
concurrency:
  group: relay-hour-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Native preflight
        env:
          SSH_RELAY_NATIVE_ACCEPTANCE: '1'
        run: node --test tests/pro/native-acceptance.cjs tests/pro/file-service.cjs tests/pro/file-transfers.cjs tests/pro/shared-manager-budget.cjs
      - name: Continuous public relay SSH and SFTP for at least one hour
        run: node tests/pro/unattended-hour.cjs
      - name: Upload sanitized result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unattended-hour-${{ matrix.os }}
          path: stability-results/result.json
          if-no-files-found: error
